name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Linter
      run: npm run lint
      
    - name: Run Tests
      run: npm run test
      
    - name: Build Project
      run: npm run build
      env:
        # Dummy env vars to ensure build succeeds without complaining about missing vars
        NEXT_PUBLIC_SENTRY_DSN: ""
        UPSTASH_REDIS_REST_URL: ""
        UPSTASH_REDIS_REST_TOKEN: ""
